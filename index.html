<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서비스 중단 안내</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#0f172a;
    color:#e2e8f0;
    font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.notice{
    width:min(100%,700px);
    background:#1e293b;
    border:2px solid #ef4444;
    border-radius:20px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 30px rgba(239,68,68,.25);
}

.notice h1{
    margin-bottom:20px;
    font-size:32px;
    color:#f87171;
}

.notice p{
    line-height:1.9;
    font-size:18px;
    color:#cbd5e1;
}
</style>
</head>

<body>

<div class="notice">
    <h1>⚠️ 서비스 중단 안내</h1>

    <p>
        <br>
        게임 배포 중단하겠습니다.<br><br>

        지인들 하라고 오픈된 환경에 가볍게 만들었는데 .<br><br>
        해킹 시도가 있어 게임 삭제합니다. .<br><br>

        이용에 불편을 드려 죄송합니다.
    </p>
</div>

</body>
</html>
